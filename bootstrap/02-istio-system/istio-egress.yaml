_internal_defaults_do_not_set:
  kind: Deployment

  service:
    type: ClusterIP

    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021

      - name: http2
        port: 80
        protocol: TCP
        targetPort: 80

      - name: https
        port: 443
        protocol: TCP
        targetPort: 443