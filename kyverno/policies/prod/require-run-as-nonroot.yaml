apiVersion: policies.kyverno.io/v1alpha1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Audit

  evaluation:
    background:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

    namespaceSelector:
      matchLabels:
        workload: "true"

  variables:
    - name: ctnrs
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        (
          object.spec.?securityContext.?runAsNonRoot.orValue(false) == true
          &&
          variables.ctnrs.all(
            c,
            c.?securityContext.?runAsNonRoot.orValue(true) == true
          )
        )
        ||
        variables.ctnrs.all(
          c,
          c.?securityContext.?runAsNonRoot.orValue(false) == true
        )
      message: >-
        Running as root is not allowed. Either
        spec.securityContext.runAsNonRoot must be set to true,
        or all containers must have
        securityContext.runAsNonRoot=true.