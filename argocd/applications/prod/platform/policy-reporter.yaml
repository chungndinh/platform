apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-reporter
  namespace: argocd
spec:
  project: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: policy-reporter

  sources:
    - repoURL: https://kyverno.github.io/policy-reporter
      chart: policy-reporter
      targetRevision: 3.10.0
      helm:
        valueFiles:
          - $values/argocd/values/prod/platform/policy-reporter/values.yaml

    - repoURL: https://github.com/chungndinh/platform.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true      