apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-addon
  namespace: argocd
spec:
  project: workloads

  source:
    repoURL: https://github.com/chungndinh/platform.git
    targetRevision: main
    path: istio/prod/httproute

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    # syncOptions:
    #   - CreateNamespace=true